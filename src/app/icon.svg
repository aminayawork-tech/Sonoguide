<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue rounded background (left favicon variant) -->
  <rect width="100" height="100" rx="22" fill="#2563EB"/>
  <!-- Waveform -->
  <path d="M10 74 C15 65 21 65 26 74 C31 83 37 83 42 74 C47 65 53 65 58 74"
        stroke="white" stroke-width="4.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Paper airplane body (white) -->
  <path d="M84 16 L14 42 L46 56 Z" fill="white"/>
  <!-- Bottom wing (slightly transparent white for fold depth) -->
  <path d="M84 16 L46 56 L16 66 Z" fill="white" opacity="0.65"/>
  <!-- Tail back face -->
  <path d="M14 42 L46 56 L16 66 Z" fill="white" opacity="0.3"/>
  <!-- Fold crease -->
  <path d="M84 16 L46 56" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
