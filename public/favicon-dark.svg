<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Dark navy rounded square background -->
  <rect width="100" height="100" rx="22" fill="#1e293b"/>
  <!-- White paper plane body -->
  <path d="M16 70 L80 18 L62 80 Z" fill="white"/>
  <!-- Fold crease (subtle dark overlay) -->
  <path d="M80 18 L46 48 L62 80 Z" fill="rgba(0,0,0,0.18)"/>
  <!-- Tail flap -->
  <path d="M16 70 L46 48 L38 66 Z" fill="rgba(0,0,0,0.12)"/>
  <!-- White wavy line (ultrasound waves) -->
  <path d="M14 90 Q20 83 26 90 Q32 97 38 90 Q44 83 50 90 Q56 97 62 90"
        stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
