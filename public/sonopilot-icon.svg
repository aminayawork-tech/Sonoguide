<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White background (middle favicon from brand kit) -->
  <rect width="100" height="100" rx="22" fill="white"/>

  <!-- Blue waveform -->
  <path d="M8 78 C13 69 20 69 25 78 C30 87 37 87 42 78 C47 69 54 69 59 78"
        stroke="#2563EB" stroke-width="5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Paper plane: main face (solid blue) -->
  <path d="M86 13 L8 45 L40 57 Z" fill="#2563EB"/>
  <!-- Under-belly (lighter blue for fold depth) -->
  <path d="M86 13 L40 57 L12 68 Z" fill="#93c5fd"/>
  <!-- Tail fold -->
  <path d="M8 45 L40 57 L12 68 Z" fill="#60a5fa"/>
  <!-- Fold crease highlight -->
  <path d="M86 13 L40 57" stroke="white" stroke-width="2"
        stroke-linecap="round" opacity="0.9"/>
</svg>
